<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
</head>
<html>
<script src='https://d3js.org/d3.v7.min.js'></script>
<style> circle {fill: lightblue; stroke: black;} </style>
<body onload='init()'>
<!--<svg width=300 height=300> -->
<!-- </svg> -->
<script>
async function init() {
const data = await d3.csv("https://flunky.github.io/cars2017.csv");
  // Add X axis
  
            
const gasData = data.filter(d =>
  Number(d.EngineCylinders) > 0
);
/*
const width = 500;
const height = 500;

const margin = {
  top: 60,
  right: 40,
  bottom: 70,
  left: 70
};

const plotWidth = width - margin.left - margin.right;
const plotHeight = height - margin.top - margin.bottom;
*/
  const svg1 = d3.create("svg").attr("width", 500).attr("height", 500);

// ==================== ADDED: CHART TITLE ====================
svg1.append("text")
  .attr("x", 150)
  .attr("y", 20)
  .attr("text-anchor", "middle")
  .attr("font-size", 16)
  .attr("font-weight", "bold")
  .text("City vs. Highway Fuel Economy");
// ===========================================================
var x = d3.scaleLog([10, 150], [ 0, 350 ]).base(10);
  var y = d3.scaleLog([10, 150], [350, 0]).base(10);
// Add dots
  svg1.append('g')
   .attr("transform", "translate(50,50)")
    .selectAll("circle")
    .data(data)
    .enter()
    .append("circle")
      .attr("cx", function (d) { return x(d.AverageCityMPG); } )
      .attr("cy", function (d) { return y(d.AverageHighwayMPG); } )
      .attr("r", function (d){ return Number(d.EngineCylinders) + 2 ; });
      
// ==================== ADDED: TOOLTIPS ====================
svg1.selectAll("circle")
  .append("title")
  .text(function (d) {
    return (
      "Make: " + d.Make +
      "\nCity MPG: " + d.AverageCityMPG +
      "\nHighway MPG: " + d.AverageHighwayMPG +
      "\nCylinders: " + d.EngineCylinders
    );
  });
// ========================================================
  // Add Y axis
  svg1.append("g")
    .attr("transform", "translate(50,50)")
    .call(d3.axisLeft(y).tickValues([10, 20, 50, 100]).tickFormat(d3.format("~s")));

  svg1.append("g")
  .attr("transform", "translate(50,400)")  
    .call(d3.axisBottom(x).tickValues([10, 20, 50, 100]).tickFormat(d3.format("~s")));

// ==================== ADDED: X-AXIS TITLE ====================
svg1.append("text")
  .attr("x", 150)
  .attr("y", 440)
  .attr("text-anchor", "middle")
  .text("Average City MPG");
// ============================================================

// ==================== ADDED: Y-AXIS TITLE ====================
svg1.append("text")
  .attr("transform", "rotate(-90)")
  .attr("x", -150)
  .attr("y", 15)
  .attr("text-anchor", "middle")
  .text("Average Highway MPG");
// ============================================================
  const svg2 = d3.create("svg").attr("width", 300).attr("height", 300);

// Add dots
  svg2.append('g')
   .attr("transform", "translate(50,50)")
    .selectAll("circle")
    .data(gasData)
    .enter()
    .append("circle")
      .attr("cx", function (d) { return x(d.AverageCityMPG); } )
      .attr("cy", function (d) { return y(d.AverageHighwayMPG); } )
      .attr("r", function (d){ return Number(d.EngineCylinders) + 2 ; });
      

  // Add Y axis
  svg2.append("g")
    .attr("transform", "translate(50,50)")
    .call(d3.axisLeft(y).tickValues([10, 20, 50, 100]).tickFormat(d3.format("~s")));

  svg2.append("g")
  .attr("transform", "translate(50,250)")  
    .call(d3.axisBottom(x).tickValues([10, 20, 50, 100]).tickFormat(d3.format("~s")));

// bar chart
// Use nonElectricData instead of data to exclude electric vehicles
const fuelData = data.filter(d =>
  d.Make &&
  Number(d.AverageCityMPG) > 0 &&
  Number(d.AverageHighwayMPG) > 0
);

console.log(d3.rollups);

// Calculate average combined MPG for each make
const topMakes = d3.rollups(
  fuelData,
  vehicles => d3.mean(
    vehicles,
    d => (
      Number(d.AverageCityMPG) +
      Number(d.AverageHighwayMPG)
    ) / 2
  ),
  d => d.Make
)
  .map(([make, mpg]) => ({ make, mpg }))
  .sort((a, b) => d3.descending(a.mpg, b.mpg))
  .slice(0, 5);

const width = 500;
const height = 350;

const margin = {
  top: 50,
  right: 30,
  bottom: 60,
  left: 100
};

const svg3 = d3.create("svg")
  .attr("width", width)
  .attr("height", height);

// X scale
const yBar = d3.scaleBand()
  .domain(topMakes.map(d => d.make))
  .range([margin.top, height - margin.bottom])
  .padding(0.2);

// Y scale
const xBar = d3.scaleLinear()
  .domain([0, d3.max(topMakes, d => d.mpg)])
  .nice()
  .range([margin.left, width - margin.right]);

// Add bars
svg3.selectAll("rect")
  .data(topMakes)
  .enter()
  .append("rect")
    .attr("x", xBar(0))
    .attr("y", d => yBar(d.make))
    .attr("width", d => xBar(d.mpg) - xBar(0))
    .attr("height", yBar.bandwidth())
    .attr("fill", "green");

// Add MPG values
svg3.selectAll(".mpg-label")
  .data(topMakes)
  .enter()
  .append("text")
    .attr("class", "mpg-label")
    .attr("x", d => xBar(d.mpg) + 5)
    .attr("y", d => yBar(d.make) + yBar.bandwidth() / 2)
    .attr("dominant-baseline", "middle")
    .text(d => d.mpg.toFixed(1));

// Add X-axis
svg3.append("g")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(xBar));

// Add Y-axis
svg3.append("g")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(yBar));

// Title
svg3.append("text")
  .attr("x", width / 2)
  .attr("y", 25)
  .attr("text-anchor", "middle")
  .text("Top 5 Most Fuel-Efficient Makes");

// X-axis label
svg3.append("text")
  .attr("x", width / 2)
  .attr("y", height - 15)
  .attr("text-anchor", "middle")
  .text("Average Combined MPG");

// Y-axis label
svg3.append("text")
  .attr("transform", "rotate(-90)")
  .attr("x", -height / 2)
  .attr("y", 18)
  .attr("text-anchor", "middle")
  .text("Make");

// hello line
// Group MPG values by engine-cylinder count
const cylinderGroups = {};

data.forEach(d => {
  const cylinders = Number(d.EngineCylinders);
  const cityMPG = Number(d.AverageCityMPG);
  const highwayMPG = Number(d.AverageHighwayMPG);

  if (
    cylinders > 0 &&
    Number.isFinite(cityMPG) &&
    Number.isFinite(highwayMPG)
  ) {
    if (!cylinderGroups[cylinders]) {
      cylinderGroups[cylinders] = {
        city: [],
        highway: []
      };
    }

    cylinderGroups[cylinders].city.push(cityMPG);
    cylinderGroups[cylinders].highway.push(highwayMPG);
  }
});

// Calculate average MPG for each cylinder count
const mpgByCylinders = Object.entries(cylinderGroups)
  .map(([cylinders, values]) => ({
    cylinders: Number(cylinders),
    city: d3.mean(values.city),
    highway: d3.mean(values.highway)
  }))
  .sort((a, b) => a.cylinders - b.cylinders);

console.log(mpgByCylinders);

const lineWidth = 550;
const lineHeight = 400;

const lineMargin = {
  top: 60,
  right: 40,
  bottom: 60,
  left: 70
};

const svg4 = d3.create("svg")
  .attr("width", lineWidth)
  .attr("height", lineHeight);

// X scale: engine cylinders
const xLine = d3.scaleLinear()
  .domain(d3.extent(mpgByCylinders, d => d.cylinders))
  .range([lineMargin.left, lineWidth - lineMargin.right]);

// Y scale: average MPG
const yLine = d3.scaleLinear()
  .domain([
    0,
    d3.max(mpgByCylinders, d => Math.max(d.city, d.highway))
  ])
  .nice()
  .range([lineHeight - lineMargin.bottom, lineMargin.top]);

// City MPG line
const cityLine = d3.line()
  .x(d => xLine(d.cylinders))
  .y(d => yLine(d.city));

// Highway MPG line
const highwayLine = d3.line()
  .x(d => xLine(d.cylinders))
  .y(d => yLine(d.highway));

// Add city line
svg4.append("path")
  .datum(mpgByCylinders)
  .attr("fill", "none")
  .attr("stroke", "orange")
  .attr("stroke-width", 3)
  .attr("d", cityLine);

// Add highway line
svg4.append("path")
  .datum(mpgByCylinders)
  .attr("fill", "none")
  .attr("stroke", "steelblue")
  .attr("stroke-width", 3)
  .attr("d", highwayLine);

// Add city points
svg4.selectAll(".city-point")
  .data(mpgByCylinders)
  .enter()
  .append("circle")
    .attr("class", "city-point")
    .attr("cx", d => xLine(d.cylinders))
    .attr("cy", d => yLine(d.city))
    .attr("r", 4)
    .attr("fill", "orange");

// Add highway points
svg4.selectAll(".highway-point")
  .data(mpgByCylinders)
  .enter()
  .append("circle")
    .attr("class", "highway-point")
    .attr("cx", d => xLine(d.cylinders))
    .attr("cy", d => yLine(d.highway))
    .attr("r", 4)
    .attr("fill", "steelblue");

// X-axis
svg4.append("g")
  .attr(
    "transform",
    `translate(0,${lineHeight - lineMargin.bottom})`
  )
  .call(
    d3.axisBottom(xLine)
      .tickValues(mpgByCylinders.map(d => d.cylinders))
      .tickFormat(d3.format("d"))
  );

// Y-axis
svg4.append("g")
  .attr("transform", `translate(${lineMargin.left},0)`)
  .call(d3.axisLeft(yLine));

// Title
svg4.append("text")
  .attr("x", lineWidth / 2)
  .attr("y", 25)
  .attr("text-anchor", "middle")
  .attr("font-size", 18)
  .text("Fuel Economy by Engine Size");

// X-axis label
svg4.append("text")
  .attr("x", lineWidth / 2)
  .attr("y", lineHeight - 15)
  .attr("text-anchor", "middle")
  .text("Engine Cylinders");

// Y-axis label
svg4.append("text")
  .attr("transform", "rotate(-90)")
  .attr("x", -lineHeight / 2)
  .attr("y", 18)
  .attr("text-anchor", "middle")
  .text("Average MPG");

// Highway legend
svg4.append("line")
  .attr("x1", 330)
  .attr("x2", 355)
  .attr("y1", 45)
  .attr("y2", 45)
  .attr("stroke", "steelblue")
  .attr("stroke-width", 3);

svg4.append("text")
  .attr("x", 360)
  .attr("y", 49)
  .text("Highway MPG");

// City legend
svg4.append("line")
  .attr("x1", 330)
  .attr("x2", 355)
  .attr("y1", 65)
  .attr("y2", 65)
  .attr("stroke", "orange")
  .attr("stroke-width", 3);

svg4.append("text")
  .attr("x", 360)
  .attr("y", 70)
  .text("City MPG");
// hello line

const charts = {
  scatter: svg1,
  bar: svg3,
  line: svg4
};
// Remove an older container if the code was run before
d3.select("#chart-container").remove();

const container = d3.select("body")
  .append("div")
  .attr("id", "chart-container");
const scenes = [
  {
    id: "all-vehicles",
    chart: "scatter",
    trigger: {
      type: "timer",
      delay: 3000
    },

    parameters: [
      {
        selector: "circle",
        attribute: "opacity",
        value: 0.5
      }
    ],

    annotations: [
      {
        type: "text",
        x: 150,
        y: 35,
        text: "All vehicles"
      }
    ]
  },

  {
    id: "efficient-vehicles",
    chart: "scatter",
    trigger: {
      type: "button",
      selector: "#next-button"
    },

    parameters: [
      {
        selector: "circle",
        attribute: "opacity",
        value: function(d) {
          return Number(d.AverageCityMPG) >= 40 ? 1 : 0.1;
        }
      },
      {
        selector: "circle",
        attribute: "fill",
        value: function(d) {
          return Number(d.AverageCityMPG) >= 40
            ? "green"
            : "gray";
        }
      }
    ],

    annotations: [
      {
        type: "text",
        x: 180,
        y: 35,
        text: "High-efficiency vehicles highlighted"
      }
    ]
  },

  {
    id: "top-makes",
    chart: "bar",
    trigger: {
      type: "chart-click",
      selector: "rect"
    },

    parameters: [],

    annotations: [
      {
        type: "text",
        x: 250,
        y: 45,
        text: "Top five makes by average MPG"
      }
    ]
  },

  {
    id: "engine-size",
    chart: "line",
    trigger: {
      type: "button",
      selector: "#restart-button"
    },

    parameters: [],

    annotations: []
  }
];
function applyParameters(svg, parameters) {
   parameters.forEach(parameter => {
    svg.selectAll(parameter.selector)
      .attr(parameter.attribute, parameter.value);
  });
}

function addAnnotations(svg, annotations) {
  // Remove annotations from the previous scene
  svg.selectAll(".scene-annotations").remove();

  const annotationLayer = svg.append("g")
    .attr("class", "scene-annotations");

  annotations.forEach(annotation => {
    if (annotation.type === "text") {
      annotationLayer.append("text")
        .attr("x", annotation.x)
        .attr("y", annotation.y)
        .attr("text-anchor", "middle")
        .attr("font-weight", "bold")
        .text(annotation.text);
    }
  });
}

function showScene(scene) {
  const svg = charts[scene.chart];

  // Remove the displayed SVG only
  container.select("svg").remove();

  // Add the selected chart
  container.append(() => svg.node());

  // Apply the scene-specific changes
  applyParameters(svg, scene.parameters || []);
  addAnnotations(svg, scene.annotations || []);
}




const controls = d3.select("body")
  .append("div")
  .attr("id", "scene-controls");

controls.append("button")
  .attr("id", "next-button")
  .text("Next");

controls.append("button")
  .attr("id", "restart-button")
  .text("Restart");

let activeTimer;

function waitForTrigger(scene, nextScene) {
  const trigger = scene.trigger;

  // Remove old timer
  clearTimeout(activeTimer);

  // Remove previous scene event handlers
  d3.select("#next-button").on(".scene", null);
  d3.select("#restart-button").on(".scene", null);

  Object.values(charts).forEach(chart => {
    chart.selectAll("*").on(".scene", null);
  });

  if (!trigger) {
    return;
  }

  if (trigger.type === "timer") {
    activeTimer = setTimeout(nextScene, trigger.delay);
  }

  if (trigger.type === "button") {
    d3.select(trigger.selector)
      .on("click.scene", nextScene);
  }

  if (trigger.type === "chart-click") {
    const svg = charts[scene.chart];

    svg.selectAll(trigger.selector)
      .style("cursor", "pointer")
      .on("click.scene", function(event, d) {
        console.log("Clicked:", d);
        nextScene();
      });
  }
}

function updateControls(scene) {
  d3.select("#next-button")
    .style(
      "display",
      scene.trigger?.selector === "#next-button"
        ? "inline-block"
        : "none"
    );

  d3.select("#restart-button")
    .style(
      "display",
      scene.trigger?.selector === "#restart-button"
        ? "inline-block"
        : "none"
    );
}

//showScene(scenes[0]);
let sceneIndex = 0;
function playScenes() {
  const scene = scenes[sceneIndex];

  showScene(scene);
  updateControls(scene)
  waitForTrigger(scene, function() {
    sceneIndex = (sceneIndex + 1) % scenes.length;
    playScenes();
  });

}
// 5. Start the presentation
playScenes();

}
</script>
</body>
</html>
